<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leveraged - Homepage</title>
<style>
  @font-face {
    font-family: "Suisse Intl";
    src: url("/lvgd-home-test/assets/fonts/SuisseIntl-Light.woff2") format("woff2");
    font-weight: 300;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Suisse Intl";
    src: url("/lvgd-home-test/assets/fonts/SuisseIntl-Regular.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Suisse Intl";
    src: url("/lvgd-home-test/assets/fonts/SuisseIntl-Medium.woff2") format("woff2");
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Suisse Intl";
    src: url("/lvgd-home-test/assets/fonts/SuisseIntl-Semibold.woff2") format("woff2");
    font-weight: 600;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg: #042820;
    --mint: #9af5bd;
    --green-text: #3b7860;
    --border: #22513f;
    --yellow: #ffee00;
    --yellow-hover: #f3e400;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--mint);
    font-family: "Suisse Intl", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-weight: 300;
  }

  .page {
    max-width: 1440px;
    margin: 0 auto;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 3;
  }

  .logo img {
    display: block;
    height: 34px;
    width: auto;
  }

  nav.main-nav {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--mint);
    text-decoration: none;
    font-size: 16px;
    font-weight: 300;
    white-space: nowrap;
  }

  .nav-item .chevron {
    width: 11px;
    height: 11px;
    display: block;
  }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .login-link {
    color: var(--mint);
    text-decoration: underline;
    font-size: 16px;
    font-weight: 300;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 16px;
    border-radius: 500px;
    font-size: 16px;
    font-weight: 300;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    border: none;
  }

  .btn-yellow { background: var(--yellow); color: var(--bg); }
  .btn-yellow:hover { background: var(--yellow-hover); }

  .btn-mint { background: var(--mint); color: var(--bg); }
  .btn-mint:hover { background: #86e6ab; }

  .btn-outline {
    background: transparent;
    color: var(--mint);
    border: 1px solid var(--mint);
  }
  .btn-outline:hover { background: rgba(154, 245, 189, 0.08); }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    height: 800px;
    overflow: hidden;
  }

  .hero-dots {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(154, 245, 189, 0.16) 1px, transparent 1.4px);
    background-size: 34px 34px;
    background-position: 20px 20px;
  }

  .hero-vignette {
    position: absolute;
    left: 0;
    top: calc(50% - 13.5px);
    transform: translateY(-50%);
    width: 100%;
    height: 315px;
    background: linear-gradient(
      to top,
      rgba(4, 40, 32, 0) 0%,
      rgba(4, 40, 32, 0.8) 21.855%,
      rgba(4, 40, 32, 0.9) 34.967%,
      rgb(4, 40, 32) 43.709%,
      rgba(4, 40, 32, 0.9) 61.193%,
      rgba(4, 40, 32, 0.8) 74.306%,
      rgba(4, 40, 32, 0) 87.418%
    );
  }

  .hero-wave {
    position: absolute;
    left: 0;
    bottom: 0.2px;
    width: 100%;
    height: 177.797px;
    transform: scaleY(-1);
    object-fit: cover;
    pointer-events: none;
  }

  .hero-title {
    position: absolute;
    left: 50%;
    top: 299px;
    transform: translateX(-50%);
    width: 979px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    z-index: 2;
  }

  .hero-title .text {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    width: 100%;
    color: var(--mint);
    text-align: center;
  }

  .hero-title h1 {
    margin: 0;
    font-size: 52px;
    font-weight: 300;
    letter-spacing: -1.04px;
    line-height: normal;
    white-space: nowrap;
  }

  .hero-title .subtitle {
    margin: 0;
    font-size: 24px;
    font-weight: 300;
    letter-spacing: -0.48px;
    line-height: normal;
    width: 100%;
  }

  .hero-buttons {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logos-bar {
    position: absolute;
    left: 50%;
    top: 680px;
    transform: translateX(-50%);
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 19px 24px;
    background: var(--bg);
  }

  .trusted-text {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-shrink: 0;
  }

  .trusted-text p {
    margin: 0;
    width: 150px;
    color: var(--green-text);
    font-size: 16px;
    font-weight: 300;
    text-align: right;
    line-height: normal;
  }

  .logos-divider {
    background: var(--border);
    width: 1px;
    height: 28px;
    flex-shrink: 0;
  }

  .company-logos {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .company-logo {
    height: 40px;
    width: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
    position: relative;
  }

  .company-logo img { display: block; }

  .company-logo.forbes img { width: 88.009px; height: 21.684px; }
  .company-logo.stripe img { width: 71.665px; height: 29.819px; }

  .company-logo.yahoo .yahoo-inner {
    position: relative;
    width: 75.5px;
    height: 27.549px;
  }
  .company-logo.yahoo .yahoo-inner img { position: absolute; display: block; }
  .company-logo.yahoo .y-main { left: 0.544px; top: 0.3px; width: 74.463px; height: 17.238px; }
  .company-logo.yahoo .y-finance { left: 20.984px; top: 19.716px; width: 33.657px; height: 5.533px; }

  .proftit-mark {
    color: var(--mint);
    font-size: 22px;
    font-weight: 600;
    font-style: italic;
    letter-spacing: -0.5px;
    white-space: nowrap;
  }

  @media (max-width: 1100px) {
    nav.main-nav { display: none; }
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <a href="#" class="logo" aria-label="Leveraged home">
        <img src="/lvgd-home-test/assets/logo-light.svg" alt="Leveraged">
      </a>

      <nav class="main-nav">
        <a href="#" class="nav-item">
          Academy
          <img src="/lvgd-home-test/assets/images/vector-chevron.svg" class="chevron" alt="">
        </a>
        <a href="#" class="nav-item">Profit Calculator</a>
        <a href="#" class="nav-item">Knowledge Center</a>
        <a href="#" class="nav-item">Daily market reviews</a>
        <a href="#" class="nav-item">Quiz</a>
      </nav>

      <div class="nav-right">
        <a href="#" class="login-link">Log In</a>
        <a href="#" class="btn btn-mint">Sign Up</a>
      </div>
    </header>

    <section class="hero">
      <div class="hero-dots"></div>
      <div class="hero-vignette"></div>
      <img src="/lvgd-home-test/assets/images/hero-gradient-pattern.png" class="hero-wave" alt="">

      <div class="hero-title">
        <div class="text">
          <h1>Your hunger to grow &mdash; is what sets you apart</h1>
          <p class="subtitle">Get Leveraged with our tools and capital and realize your true potential</p>
        </div>
        <div class="hero-buttons">
          <a href="#" class="btn btn-yellow">Get Leveraged</a>
          <a href="#" class="btn btn-outline">Take the quiz</a>
        </div>
      </div>

      <div class="logos-bar">
        <div class="trusted-text">
          <p>Trusted by the<br>Worldwide Leaders</p>
        </div>
        <div class="logos-divider"></div>
        <div class="company-logos">
          <div class="company-logo forbes"><img src="/lvgd-home-test/assets/images/forbes-logo.svg" alt="Forbes"></div>
          <div class="company-logo stripe"><img src="/lvgd-home-test/assets/images/stripe-logo.svg" alt="Stripe"></div>
          <div class="company-logo yahoo">
            <div class="yahoo-inner">
              <img src="/lvgd-home-test/assets/images/yahoo-group1.svg" alt="Yahoo Finance" class="y-main">
              <img src="/lvgd-home-test/assets/images/yahoo-group2.svg" alt="" class="y-finance">
            </div>
          </div>
          <div class="company-logo proftit"><span class="proftit-mark">proftit</span></div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
