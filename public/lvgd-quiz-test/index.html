<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leveraged - Find Your Challenge</title>
<style>
  @font-face {
    font-family: "Suisse Intl";
    src: url("/lvgd-quiz-test/assets/fonts/SuisseIntl-Light.woff2") format("woff2");
    font-weight: 300; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Suisse Intl";
    src: url("/lvgd-quiz-test/assets/fonts/SuisseIntl-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Suisse Intl";
    src: url("/lvgd-quiz-test/assets/fonts/SuisseIntl-Medium.woff2") format("woff2");
    font-weight: 500; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Suisse Intl";
    src: url("/lvgd-quiz-test/assets/fonts/SuisseIntl-Semibold.woff2") format("woff2");
    font-weight: 600; font-style: normal; font-display: swap;
  }

  :root {
    --bg: #042820;
    --mint: #9af5bd;
    --mint-dim: rgba(154, 245, 189, 0.75);
    --mint-faint: rgba(154, 245, 189, 0.14);
    --green-text: #3b7860;
    --border: #22513f;
    --yellow: #ffee00;
    --yellow-hover: #f3e400;
    --border-strong: rgba(154, 245, 189, 0.45);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--mint);
    font-family: "Suisse Intl", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  .bg-dots {
    position: fixed;
    inset: 0;
    background-image: radial-gradient(var(--mint-faint) 1px, transparent 1.4px);
    background-size: 28px 28px;
    background-position: 14px 14px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    border-bottom: 1px solid var(--border);
  }

  header img { height: 30px; width: auto; display: block; }

  .shell {
    position: relative;
    z-index: 1;
    max-width: 560px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  /* ---------- Intro screen ---------- */
  .intro { text-align: center; padding-top: 12px; }

  .intro .kicker {
    display: inline-block;
    color: var(--bg);
    background: var(--yellow);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 18px;
  }

  .intro h1 {
    font-size: 26px;
    font-weight: 400;
    letter-spacing: -0.3px;
    line-height: 1.25;
    margin: 0 0 16px;
  }

  .intro p {
    font-size: 15px;
    line-height: 1.55;
    color: var(--mint);
    margin: 0 0 28px;
  }

  .intro .fine-print {
    font-size: 13px;
    color: var(--mint-dim);
    margin-top: 14px;
  }

  .btn-primary {
    display: block;
    width: 100%;
    text-align: center;
    background: var(--yellow);
    color: var(--bg);
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    padding: 15px;
    border-radius: 999px;
    border: none;
    text-decoration: none;
    cursor: pointer;
  }
  .btn-primary:hover { background: var(--yellow-hover); }

  .progress-track {
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: rgba(154, 245, 189, 0.12);
    overflow: hidden;
    margin-bottom: 32px;
  }

  .progress-fill {
    height: 100%;
    background: var(--mint);
    border-radius: 999px;
    width: 0%;
    transition: width 0.35s ease;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--mint);
    text-decoration: none;
    font-size: 14px;
    margin-bottom: 18px;
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
    padding: 0;
  }
  .back-link:hover { color: var(--yellow); }

  .step-label {
    color: var(--mint);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0 0 10px;
  }

  .question h1 {
    font-size: 24px;
    font-weight: 400;
    letter-spacing: -0.3px;
    line-height: 1.25;
    margin: 0 0 24px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .option-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: rgba(154, 245, 189, 0.05);
    border: 1px solid var(--border-strong);
    color: var(--mint);
    font-family: inherit;
    font-size: 16px;
    font-weight: 300;
    padding: 16px 18px;
    border-radius: 14px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .option-btn:hover {
    border-color: var(--mint);
    background: rgba(154, 245, 189, 0.1);
  }

  .option-btn.selected {
    border-color: var(--yellow);
    background: rgba(154, 245, 189, 0.16);
  }

  /* ---------- Calculating ---------- */
  .calculating {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 80px 20px;
    gap: 20px;
  }

  .spinner {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 3px solid rgba(154, 245, 189, 0.2);
    border-top-color: var(--mint);
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .calculating p {
    font-size: 16px;
    color: var(--mint-dim);
    margin: 0;
  }

  /* ---------- Result ---------- */
  .result-label {
    color: var(--mint);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0 0 10px;
    text-align: center;
  }

  .result-headline {
    font-size: 30px;
    font-weight: 400;
    letter-spacing: -0.4px;
    text-align: center;
    margin: 0 0 12px;
  }

  .result-tagline {
    font-size: 16px;
    color: var(--mint-dim);
    text-align: center;
    max-width: 440px;
    margin: 0 auto 32px;
    line-height: 1.5;
  }

  .product-card {
    border: 1px solid var(--border-strong);
    border-radius: 18px;
    padding: 24px;
    background: rgba(154, 245, 189, 0.06);
    margin-bottom: 24px;
  }

  .product-card h2 {
    font-size: 22px;
    font-weight: 500;
    margin: 0 0 4px;
  }

  .product-card .tier {
    font-size: 15px;
    font-weight: 500;
    color: var(--yellow);
    margin: 0 0 16px;
  }

  .product-card .rationale {
    font-size: 15px;
    line-height: 1.55;
    color: var(--mint);
    margin: 0 0 20px;
  }

  .stat-chips {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .stat-chip {
    flex: 1 1 auto;
    min-width: 90px;
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 10px 12px;
    text-align: center;
    background: rgba(154, 245, 189, 0.04);
  }

  .stat-chip .label {
    display: block;
    font-size: 11px;
    font-weight: 400;
    color: var(--mint);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }

  .stat-chip .value {
    display: block;
    font-size: 17px;
    font-weight: 500;
    color: var(--yellow);
  }

  .cta-btn {
    display: block;
    width: 100%;
    text-align: center;
    background: var(--yellow);
    color: var(--bg);
    font-family: inherit;
    font-size: 17px;
    font-weight: 500;
    padding: 16px;
    border-radius: 999px;
    border: none;
    text-decoration: none;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .cta-btn:hover { background: var(--yellow-hover); }

  .retake-link {
    display: block;
    text-align: center;
    color: var(--mint-dim);
    font-size: 14px;
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
    width: 100%;
  }
  .retake-link:hover { color: var(--mint-dim); }

  @media (min-width: 640px) {
    .intro h1 { font-size: 34px; }
    .intro p { font-size: 16px; }
    .question h1 { font-size: 28px; }
    .result-headline { font-size: 36px; }
  }
</style>
</head>
<body>
  <div class="bg-dots"></div>

  <header>
    <img src="/lvgd-quiz-test/assets/logo-light.svg" alt="Leveraged">
  </header>

  <div class="shell" id="app"></div>

  <script>
    const QUESTIONS = [
      {
        key: "market",
        question: "Which markets excite you most?",
        options: [
          { label: "Forex & Indices", value: "forex" },
          { label: "Stocks & Commodities", value: "stocks" },
          { label: "Crypto", value: "crypto" },
          { label: "Not sure yet, open to anything", value: "unsure" }
        ]
      },
      {
        key: "experience",
        question: "How would you describe your trading experience?",
        options: [
          { label: "Brand new, still learning", value: "new" },
          { label: "Some experience, a few live trades", value: "some" },
          { label: "Experienced, I've traded live capital before", value: "experienced" },
          { label: "Very experienced, this is basically my job", value: "pro" }
        ]
      },
      {
        key: "priority",
        question: "What matters more to you right now?",
        options: [
          { label: "Getting funded as fast as possible, even if it costs a bit more upfront", value: "fast", weight: { sprint: 1 } },
          { label: "Proving myself first, keeping upfront risk as low as possible", value: "prove", weight: { core: 1 } },
          { label: "Both matter equally", value: "both", weight: {} }
        ]
      },
      {
        key: "losing_streak",
        question: "How do you handle a losing streak?",
        options: [
          { label: "I stay disciplined, small controlled losses don't rattle me", value: "disciplined", weight: { sprint: 1 } },
          { label: "I like having a bit more breathing room to recover", value: "breathing_room", weight: { core: 1 } },
          { label: "I'd rather cut losses immediately and reset", value: "cut_reset", weight: {} }
        ]
      },
      {
        key: "capital",
        question: "How much capital would you feel confident managing once funded?",
        options: [
          { label: "Starting small, $10K–$25K", value: "small" },
          { label: "Mid-size, $50K", value: "mid" },
          { label: "Go big, $100K+", value: "big" },
          { label: "Not sure, whatever fits my experience", value: "unsure" }
        ]
      }
    ];

    const PRODUCTS = {
      turbo: {
        name: "Turbo",
        cta: "Start My Turbo Challenge",
        persona: "The Calculated Climber",
        tagline: "You'd rather prove your edge before risking real money, and you're comfortable riding out a few rough days to get there.",
        url: "https://getleveraged.com/turbo-trade/",
        stats: [["Upfront", "$8.88"], ["Profit Target", "6%"], ["Timeline", "No limit"]],
        tiers: ["$10K", "$25K", "$50K", "$100K", "$150K", "$200K"]
      },
      crypto: {
        name: "Crypto Challenge",
        cta: "Start My Crypto Challenge",
        persona: "The Digital Frontier Trader",
        tagline: "Crypto is where you want to trade, and you're ready to prove it before funding.",
        url: "https://getleveraged.com/crypto/",
        stats: [["Upfront", "$8.88"], ["Profit Target", "6%"], ["Leverage", "1:3"]],
        tiers: ["$10K", "$25K", "$50K", "$100K", "$150K"]
      },
      sprint: {
        name: "Sprint",
        cta: "Start My Sprint Challenge",
        persona: "The Fast Starter",
        tagline: "You want to be trading a funded account fast, and you keep tight control over risk along the way.",
        url: "https://getleveraged.com/sprint/",
        stats: [["Upfront", "From $49"], ["Profit Target", "2%"], ["Funded", "Fast track"]],
        tiers: ["$10K", "$25K", "$50K", "$100K"]
      }
    };

    const MARKET_LABEL = { forex: "Forex & Indices", stocks: "Stocks & Commodities", crypto: "Crypto", unsure: "a range of markets" };
    const EXPERIENCE_LABEL = { new: "brand-new", some: "developing", experienced: "experienced", pro: "professional-level" };
    const EXPERIENCE_TIER_INDEX = { new: 0, some: 1, experienced: 2, pro: 3 };

    const state = { step: -1, answers: {} };
    const app = document.getElementById("app");

    function trackEvent(name, params) {
      console.log("[Pixel]", name, params || {});
      // Production wiring: fbq('trackCustom', name, params);
    }

    function render() {
      if (state.step === -1) {
        renderIntro();
      } else if (state.step < QUESTIONS.length) {
        renderQuestion(state.step);
      } else if (state.step === QUESTIONS.length) {
        renderCalculating();
      } else {
        renderResult();
      }
    }

    function renderIntro() {
      app.innerHTML = `
        <div class="intro">
          <span class="kicker">Find Your Challenge</span>
          <h1>Which trading challenge is actually right for you?</h1>
          <p>Turbo, Crypto Challenge, or Sprint each fit a different kind of trader. Answer 5 quick questions and we'll match you to the right one, with the account size to match.</p>
          <button class="btn-primary" id="beginBtn">Find My Challenge</button>
          <p class="fine-print">Takes about 60 seconds.</p>
        </div>
      `;
      document.getElementById("beginBtn").addEventListener("click", () => {
        trackEvent("QuizStarted");
        state.step = 0;
        render();
      });
    }

    function renderQuestion(index) {
      const q = QUESTIONS[index];
      const pct = Math.round((index / QUESTIONS.length) * 100);
      app.innerHTML = `
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        ${index > 0 ? `<button class="back-link" id="backBtn">&larr; Back</button>` : ""}
        <p class="step-label">Question ${index + 1} of ${QUESTIONS.length}</p>
        <div class="question">
          <h1>${q.question}</h1>
          <div class="options">
            ${q.options.map((opt, i) => `<button class="option-btn" data-index="${i}">${opt.label}</button>`).join("")}
          </div>
        </div>
      `;

      const backBtn = document.getElementById("backBtn");
      if (backBtn) backBtn.addEventListener("click", () => { state.step -= 1; render(); });

      app.querySelectorAll(".option-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          app.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
          const opt = q.options[parseInt(btn.dataset.index, 10)];
          state.answers[q.key] = opt;
          setTimeout(() => { state.step += 1; render(); }, 250);
        });
      });
    }

    function renderCalculating() {
      app.innerHTML = `
        <div class="progress-track"><div class="progress-fill" style="width:100%"></div></div>
        <div class="calculating">
          <div class="spinner"></div>
          <p>Calculating your result...</p>
        </div>
      `;
      trackEvent("QuizCompleted", { answers: Object.fromEntries(Object.entries(state.answers).map(([k, v]) => [k, v.value])) });
      setTimeout(() => { state.step += 1; render(); }, 1200);
    }

    function computeResult() {
      const a = state.answers;
      let productKey;

      if (a.market.value === "crypto") {
        productKey = "crypto";
      } else {
        let sprintScore = 0, coreScore = 0;
        [a.priority, a.losing_streak].forEach(ans => {
          if (ans.weight) {
            sprintScore += ans.weight.sprint || 0;
            coreScore += ans.weight.core || 0;
          }
        });
        productKey = sprintScore > coreScore ? "sprint" : "turbo";
      }

      const product = PRODUCTS[productKey];
      const tiers = product.tiers;
      let tierIndex;

      if (a.capital.value === "small") tierIndex = 1;
      else if (a.capital.value === "mid") tierIndex = 2;
      else if (a.capital.value === "big") tierIndex = tiers.length - 1;
      else {
        const expIdx = EXPERIENCE_TIER_INDEX[a.experience.value] || 0;
        tierIndex = Math.min(expIdx + 1, tiers.length - 1);
      }
      tierIndex = Math.max(0, Math.min(tierIndex, tiers.length - 1));
      const tier = tiers[tierIndex];

      const marketLabel = MARKET_LABEL[a.market.value];
      const experienceLabel = EXPERIENCE_LABEL[a.experience.value];
      const rationale = `Based on your interest in ${marketLabel} and your ${experienceLabel} trading background, plus how you answered on speed and risk, ${product.name} at the ${tier} level looks like your best fit.`;

      return { productKey, product, tier, rationale };
    }

    function renderResult() {
      const { productKey, product, tier, rationale } = computeResult();
      trackEvent(`QuizResult_${productKey.charAt(0).toUpperCase() + productKey.slice(1)}`, { tier });

      app.innerHTML = `
        <p class="result-label">Your Trader Profile</p>
        <h1 class="result-headline">${product.persona}</h1>
        <p class="result-tagline">${product.tagline}</p>

        <div class="product-card">
          <h2>${product.name} &middot; ${tier}</h2>
          <p class="tier">Recommended for you</p>
          <p class="rationale">${rationale}</p>
          <div class="stat-chips">
            ${product.stats.map(([label, value]) => `
              <div class="stat-chip">
                <span class="label">${label}</span>
                <span class="value">${value}</span>
              </div>
            `).join("")}
          </div>
        </div>

        <a href="${product.url}" class="cta-btn" id="ctaBtn" target="_blank" rel="noopener">${product.cta}</a>
        <button class="retake-link" id="retakeBtn">Retake the quiz</button>
      `;

      document.getElementById("ctaBtn").addEventListener("click", () => trackEvent("QuizCTAClicked", { productKey, tier }));
      document.getElementById("retakeBtn").addEventListener("click", () => {
        state.step = -1;
        state.answers = {};
        render();
      });
    }

    render();
  </script>
</body>
</html>
