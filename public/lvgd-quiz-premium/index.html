<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leveraged - Managing Director Track Assessment</title>
<style>
  /* ---------- Mobile-first base styles ---------- */
  @font-face {
    font-family: "Suisse Intl";
    src: url("/lvgd-quiz-premium/assets/fonts/SuisseIntl-Light.woff2") format("woff2");
    font-weight: 300; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Suisse Intl";
    src: url("/lvgd-quiz-premium/assets/fonts/SuisseIntl-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Suisse Intl";
    src: url("/lvgd-quiz-premium/assets/fonts/SuisseIntl-Medium.woff2") format("woff2");
    font-weight: 500; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Suisse Intl";
    src: url("/lvgd-quiz-premium/assets/fonts/SuisseIntl-Semibold.woff2") format("woff2");
    font-weight: 600; font-style: normal; font-display: swap;
  }

  :root {
    --bg: #042820;
    --mint: #9af5bd;
    --mint-dim: rgba(154, 245, 189, 0.75);
    --border-strong: rgba(154, 245, 189, 0.45);
    --yellow: #ffee00;
    --yellow-hover: #f3e400;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--mint);
    font-family: "Suisse Intl", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  .bg-dots {
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(154, 245, 189, 0.14) 1px, transparent 1.4px);
    background-size: 24px 24px;
    background-position: 12px 12px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 14px;
    border-bottom: 1px solid var(--border-strong);
  }

  header img { height: 26px; width: auto; display: block; }

  .shell {
    position: relative;
    z-index: 1;
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px 48px;
  }

  /* ---------- Intro screen ---------- */
  .intro { text-align: center; padding-top: 12px; }

  .intro .kicker {
    display: inline-block;
    color: var(--bg);
    background: var(--yellow);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 18px;
  }

  .intro h1 {
    font-size: 26px;
    font-weight: 400;
    letter-spacing: -0.3px;
    line-height: 1.25;
    margin: 0 0 16px;
  }

  .intro p {
    font-size: 15px;
    line-height: 1.55;
    color: var(--mint);
    margin: 0 0 28px;
  }

  .intro .fine-print {
    font-size: 13px;
    color: var(--mint-dim);
    margin-top: 14px;
  }

  /* ---------- Buttons ---------- */
  .btn-primary {
    display: block;
    width: 100%;
    text-align: center;
    background: var(--yellow);
    color: var(--bg);
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    padding: 15px;
    border-radius: 999px;
    border: none;
    text-decoration: none;
    cursor: pointer;
  }
  .btn-primary:hover { background: var(--yellow-hover); }

  /* ---------- Progress + question ---------- */
  .progress-track {
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: rgba(154, 245, 189, 0.12);
    overflow: hidden;
    margin-bottom: 28px;
  }

  .progress-fill {
    height: 100%;
    background: var(--yellow);
    border-radius: 999px;
    width: 0%;
    transition: width 0.35s ease;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--mint);
    text-decoration: none;
    font-size: 14px;
    margin-bottom: 16px;
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
    padding: 0;
  }
  .back-link:hover { color: var(--yellow); }

  .step-label {
    color: var(--mint);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0 0 8px;
  }

  .question h1 {
    font-size: 21px;
    font-weight: 400;
    letter-spacing: -0.2px;
    line-height: 1.3;
    margin: 0 0 20px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: rgba(154, 245, 189, 0.05);
    border: 1px solid var(--border-strong);
    color: var(--mint);
    font-family: inherit;
    font-size: 15px;
    font-weight: 300;
    padding: 14px 16px;
    border-radius: 12px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .option-btn:hover {
    border-color: var(--mint);
    background: rgba(154, 245, 189, 0.1);
  }

  .option-btn.selected {
    border-color: var(--yellow);
    background: rgba(154, 245, 189, 0.16);
  }

  /* ---------- Calculating ---------- */
  .calculating {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 16px;
    gap: 18px;
  }

  .spinner {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 3px solid rgba(154, 245, 189, 0.2);
    border-top-color: var(--yellow);
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .calculating p {
    font-size: 15px;
    color: var(--mint-dim);
    margin: 0;
  }

  /* ---------- Result ---------- */
  .result-label {
    color: var(--mint);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0 0 8px;
    text-align: center;
  }

  .verdict-badge {
    display: block;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--bg);
    background: var(--yellow);
    padding: 5px 14px;
    border-radius: 999px;
    width: fit-content;
    margin: 0 auto 18px;
  }

  .result-headline {
    font-size: 26px;
    font-weight: 400;
    letter-spacing: -0.3px;
    text-align: center;
    margin: 0 0 12px;
    line-height: 1.25;
  }

  .result-tagline {
    font-size: 15px;
    color: var(--mint);
    text-align: center;
    max-width: 440px;
    margin: 0 auto 28px;
    line-height: 1.55;
  }

  .program-card {
    border: 1px solid var(--border-strong);
    border-radius: 16px;
    padding: 20px;
    background: rgba(154, 245, 189, 0.06);
    margin-bottom: 20px;
  }

  .program-card h2 {
    font-size: 19px;
    font-weight: 500;
    margin: 0 0 4px;
  }

  .program-card .tier {
    font-size: 14px;
    font-weight: 500;
    color: var(--yellow);
    margin: 0 0 14px;
  }

  .program-card .rationale {
    font-size: 14px;
    line-height: 1.55;
    color: var(--mint);
    margin: 0 0 18px;
  }

  .stat-chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .stat-chip {
    flex: 1 1 auto;
    min-width: 84px;
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 9px 10px;
    text-align: center;
    background: rgba(154, 245, 189, 0.04);
  }

  .stat-chip .label {
    display: block;
    font-size: 10px;
    color: var(--mint);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }

  .stat-chip .value {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: var(--yellow);
  }

  .disclaimer {
    font-size: 12px;
    color: var(--mint-dim);
    text-align: center;
    line-height: 1.5;
    margin: 0 0 16px;
  }

  .retake-link {
    display: block;
    text-align: center;
    color: var(--mint-dim);
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
    width: 100%;
  }
  .retake-link:hover { color: var(--mint); }

  /* ---------- Progressive enhancement for larger screens ---------- */
  @media (min-width: 640px) {
    header { padding: 22px 16px; }
    header img { height: 32px; }
    .shell { padding: 32px 20px 60px; }
    .intro h1 { font-size: 32px; }
    .intro p { font-size: 16px; }
    .question h1 { font-size: 26px; }
    .option-btn { font-size: 16px; padding: 16px 18px; }
    .result-headline { font-size: 34px; }
    .result-tagline { font-size: 16px; }
    .program-card { padding: 26px; }
    .program-card h2 { font-size: 22px; }
  }
</style>
</head>
<body>
  <div class="bg-dots"></div>

  <header>
    <img src="/lvgd-quiz-premium/assets/logo-light.svg" alt="Leveraged">
  </header>

  <div class="shell" id="app"></div>

  <script>
    const QUESTIONS = [
      {
        key: "experience",
        question: "How long have you been trading live capital (not demo)?",
        options: [
          { label: "Less than 6 months", value: "under6m", points: 0 },
          { label: "6 months to 2 years", value: "6m2y", points: 1 },
          { label: "2 to 5 years", value: "2y5y", points: 2 },
          { label: "5+ years", value: "5yplus", points: 3 }
        ]
      },
      {
        key: "win_rate",
        question: "What's your realistic win rate over your last 100 trades?",
        options: [
          { label: "I don't track this precisely", value: "untracked", points: 0 },
          { label: "Under 40%", value: "under40", points: 1 },
          { label: "40-60%", value: "mid", points: 2 },
          { label: "Over 60%", value: "over60", points: 3 }
        ]
      },
      {
        key: "drawdown",
        question: "What's the largest drawdown you've experienced?",
        options: [
          { label: "I haven't experienced a serious drawdown yet", value: "none", points: 1 },
          { label: "Under 10%", value: "under10", points: 3 },
          { label: "10-25%, and I recovered", value: "mid", points: 2 },
          { label: "Over 25%, and I recovered", value: "high", points: 1 }
        ]
      },
      {
        key: "risk_mgmt",
        question: "How do you manage risk per trade?",
        options: [
          { label: "I don't have a fixed rule", value: "none", points: 0 },
          { label: "I risk a rough percentage, not strict", value: "loose", points: 1 },
          { label: "I follow a strict, consistent risk framework every trade", value: "strict", points: 3 }
        ]
      },
      {
        key: "losing_week",
        question: "If you had a major losing week, what would you do next?",
        options: [
          { label: "Try to win it back quickly", value: "revenge", points: 0 },
          { label: "Stop trading that strategy entirely", value: "stop", points: 1 },
          { label: "Take a break and reassess", value: "pause", points: 2 },
          { label: "Reduce size and stay disciplined", value: "reduce", points: 3 }
        ]
      },
      {
        key: "commitment",
        question: "How much time can you commit to trading Leveraged's capital each week?",
        options: [
          { label: "A few hours, it's a side interest", value: "side", points: 1 },
          { label: "Part-time, 10-20 hours a week", value: "parttime", points: 2 },
          { label: "Full-time, this is my main focus", value: "fulltime", points: 3 }
        ]
      }
    ];

    const TIERS = [
      {
        key: "exceptional",
        min: 14,
        badge: "Exceptional Fit",
        persona: "Institutional-Grade Trader",
        tagline: "You trade with the discipline of a professional already. This is exactly the caliber Leveraged looks for to manage our own capital directly."
      },
      {
        key: "strong",
        min: 8,
        badge: "Strong Fit",
        persona: "Rising Portfolio Manager",
        tagline: "You've got real instincts and the discipline to back them up. You're on the path to managing serious capital."
      },
      {
        key: "building",
        min: 0,
        badge: "Building Toward It",
        persona: "Trader in the Making",
        tagline: "You're building the track record institutional capital requires. Keep refining your discipline. Leveraged wants to see how you grow."
      }
    ];

    const state = { step: -1, answers: {} };
    const app = document.getElementById("app");

    function trackEvent(name, params) {
      console.log("[Pixel]", name, params || {});
      // Production wiring: fbq('trackCustom', name, params);
    }

    function render() {
      if (state.step === -1) {
        renderIntro();
      } else if (state.step < QUESTIONS.length) {
        renderQuestion(state.step);
      } else if (state.step === QUESTIONS.length) {
        renderCalculating();
      } else {
        renderResult();
      }
    }

    function renderIntro() {
      app.innerHTML = `
        <div class="intro">
          <span class="kicker">Managing Director Track</span>
          <h1>Do you have what it takes to trade our capital?</h1>
          <p>Leveraged is building a team of elite Portfolio Managers to trade directly with company capital. This 6-question assessment measures real trading discipline, not just interest. Answer honestly. Your results determine your track.</p>
          <button class="btn-primary" id="beginBtn">Begin Assessment</button>
          <p class="fine-print">Takes about 90 seconds.</p>
        </div>
      `;
      document.getElementById("beginBtn").addEventListener("click", () => {
        trackEvent("MDQuizStarted");
        state.step = 0;
        render();
      });
    }

    function renderQuestion(index) {
      const q = QUESTIONS[index];
      const pct = Math.round((index / QUESTIONS.length) * 100);
      app.innerHTML = `
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        ${index > 0 ? `<button class="back-link" id="backBtn">&larr; Back</button>` : ""}
        <p class="step-label">Question ${index + 1} of ${QUESTIONS.length}</p>
        <div class="question">
          <h1>${q.question}</h1>
          <div class="options">
            ${q.options.map((opt, i) => `<button class="option-btn" data-index="${i}">${opt.label}</button>`).join("")}
          </div>
        </div>
      `;

      const backBtn = document.getElementById("backBtn");
      if (backBtn) backBtn.addEventListener("click", () => { state.step -= 1; render(); });

      app.querySelectorAll(".option-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          app.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
          const opt = q.options[parseInt(btn.dataset.index, 10)];
          state.answers[q.key] = opt;
          setTimeout(() => { state.step += 1; render(); }, 250);
        });
      });
    }

    function renderCalculating() {
      app.innerHTML = `
        <div class="progress-track"><div class="progress-fill" style="width:100%"></div></div>
        <div class="calculating">
          <div class="spinner"></div>
          <p>Evaluating your trading profile...</p>
        </div>
      `;
      trackEvent("MDQuizCompleted", { answers: Object.fromEntries(Object.entries(state.answers).map(([k, v]) => [k, v.value])) });
      setTimeout(() => { state.step += 1; render(); }, 1300);
    }

    function computeResult() {
      const total = Object.values(state.answers).reduce((sum, a) => sum + (a.points || 0), 0);
      const tier = TIERS.find(t => total >= t.min);
      return { total, tier };
    }

    function renderResult() {
      const { total, tier } = computeResult();
      trackEvent(`MDQuizResult_${tier.key.charAt(0).toUpperCase() + tier.key.slice(1)}`, { score: total });

      app.innerHTML = `
        <p class="result-label">Your Assessment Result</p>
        <div class="verdict-badge">${tier.badge}</div>
        <h1 class="result-headline">${tier.persona}</h1>
        <p class="result-tagline">${tier.tagline}</p>

        <div class="program-card">
          <h2>Managing Director Track</h2>
          <p class="tier">Score: ${total} / 18</p>
          <p class="rationale">Based on your trading history, risk discipline, and how you handle drawdowns, this is where you stand today. Leveraged reviews every application personally as we build out this program.</p>
          <div class="stat-chips">
            <div class="stat-chip">
              <span class="label">Capital</span>
              <span class="value">Leveraged-funded</span>
            </div>
            <div class="stat-chip">
              <span class="label">Program</span>
              <span class="value">Managing Director</span>
            </div>
            <div class="stat-chip">
              <span class="label">Access</span>
              <span class="value">By application</span>
            </div>
          </div>
        </div>

        <p class="disclaimer">Managing Director is an early-access program. Applying doesn't guarantee placement, but every serious application is reviewed as we build this out.</p>

        <a href="https://getleveraged.com" class="btn-primary" id="ctaBtn" target="_blank" rel="noopener" style="margin-bottom:16px; display:block; text-decoration:none;">Apply for Managing Director Track</a>
        <button class="retake-link" id="retakeBtn">Retake the assessment</button>
      `;

      document.getElementById("ctaBtn").addEventListener("click", () => trackEvent("MDQuizCTAClicked", { tier: tier.key, score: total }));
      document.getElementById("retakeBtn").addEventListener("click", () => {
        state.step = -1;
        state.answers = {};
        render();
      });
    }

    render();
  </script>
</body>
</html>
